name: lesoes-app
on:
  push: { paths: ['lesoes-app/**'] }
  pull_request: { paths: ['lesoes-app/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lesoes-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
