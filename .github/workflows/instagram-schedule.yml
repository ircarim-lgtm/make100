name: Instagram - publicar posts agendados

on:
  schedule:
    # A cada 15 min entre 10:00 e 12:59 UTC (07:00 a 09:59 em Brasilia).
    # O GitHub pode atrasar o disparo; as janelas extras garantem a publicacao.
    - cron: "*/15 10-12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas validar, sem publicar"
        type: boolean
        default: true

concurrency:
  group: instagram-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests python-dotenv

      - name: Publicar posts que ja chegaram na hora
        working-directory: claude-instagram/scripts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: "17841431882100470"
          META_API_VERSION: v21.0
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python run_scheduled.py

      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude-instagram/published.json
          if git diff --cached --quiet; then
            echo "Nada novo para registrar."
          else
            git commit -m "Instagram: registrar posts publicados"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
